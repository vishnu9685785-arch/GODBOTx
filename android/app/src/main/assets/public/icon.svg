<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <linearGradient id="ytRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1a1a" />
      <stop offset="100%" stop-color="#cc0000" />
    </linearGradient>
    <linearGradient id="loopBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="2" />

  <!-- Blue Loop Arrows -->
  <path d="M 130 195 A 115 115 0 0 1 315 102" fill="none" stroke="url(#loopBlue)" stroke-width="19" stroke-linecap="round" />
  <polygon points="310,85 342,106 308,124" fill="#38bdf8" />
  <path d="M 350 170 A 115 115 0 0 1 165 264" fill="none" stroke="url(#loopBlue)" stroke-width="19" stroke-linecap="round" />
  <polygon points="172,282 138,260 174,242" fill="#0284c7" />

  <!-- YouTube Play Screen -->
  <g filter="url(#dropShadow)">
    <rect x="150" y="104" width="176" height="132" rx="36" fill="url(#ytRed)" />
    <polygon points="218,142 274,170 218,198" fill="#ffffff" />
  </g>

  <!-- Red Wi-Fi / Radio Broadcast Arcs -->
  <g fill="none" stroke="#ef4444" stroke-linecap="round">
    <path d="M 378 88 A 60 60 0 0 1 454 138" stroke-width="12" />
    <path d="M 384 66 A 85 85 0 0 1 478 130" stroke-width="13" />
    <path d="M 390 44 A 110 110 0 0 1 498 124" stroke-width="14" />
  </g>

  <!-- 24/7 Neon Badge -->
  <g transform="translate(372, 168)">
    <circle cx="0" cy="0" r="56" fill="#090d16" stroke="#111827" stroke-width="3" />
    <path d="M -38 -20 A 42 42 0 1 1 -28 30" fill="none" stroke="url(#neonGreen)" stroke-width="8" stroke-linecap="round" />
    <polygon points="-38,-28 -24,-12 -42,-10" fill="#4ade80" />
    <text x="0" y="11" font-family="'Plus Jakarta Sans', -apple-system, Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">24/7</text>
  </g>

  <!-- Wordmark "LoopLive" -->
  <g transform="translate(48, 362)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', -apple-system, Roboto, sans-serif" font-size="78" font-weight="900" fill="#ffffff">L</text>
    <g transform="translate(44, -28)" stroke="#ffffff" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 36,0 C 18,-24 0,-24 -14,-12 C -28,0 -28,24 -14,36 C 0,48 18,48 36,24 C 54,0 72,0 86,12 C 100,24 100,48 86,60 C 72,72 54,72 36,48" transform="matrix(0.85 0 0 0.85 24 -16)" />
    </g>
    <text x="174" y="0" font-family="'Plus Jakarta Sans', -apple-system, Roboto, sans-serif" font-size="78" font-weight="900" fill="#ffffff">p</text>
    <text x="228" y="0" font-family="'Plus Jakarta Sans', -apple-system, Roboto, sans-serif" font-size="78" font-weight="900" fill="#ff1a1a">Live</text>
  </g>

  <!-- LIVE pill & YouTube 24/7 -->
  <g transform="translate(66, 396)">
    <rect x="0" y="0" width="142" height="42" rx="21" fill="#e50914" />
    <circle cx="28" cy="21" r="9" fill="#ffffff" />
    <text x="82" y="28" font-family="'Plus Jakarta Sans', -apple-system, Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">LIVE</text>
    <text x="160" y="29" font-family="'Plus Jakarta Sans', -apple-system, Roboto, sans-serif" font-size="24" font-weight="400" fill="#ffffff">|</text>
    <text x="184" y="29" font-family="'Plus Jakarta Sans', -apple-system, Roboto, sans-serif" font-size="25" font-weight="800" fill="#ffffff">YouTube 24/7</text>
  </g>

  <!-- Tagline -->
  <text x="256" y="474" font-family="'Plus Jakarta Sans', -apple-system, Roboto, sans-serif" font-size="22" font-weight="700" fill="#cbd5e1" text-anchor="middle" letter-spacing="2">
    Upload • Loop • Stream
  </text>
</svg>
